<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>바다온 | 수온 기반 어종 분포 지도</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--ink:#16353e;--teal:#087f83;--pale:#eef8f7}*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:Arial,"Malgun Gothic",sans-serif}.top{padding:13px max(18px,5vw);background:#fff;border-bottom:1px solid #d9e7e6;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:bold}.brand b{font-size:10px;letter-spacing:1px;color:#57818a;margin-left:6px}.date{display:flex;gap:8px;align-items:center;background:#eaf4f1;padding:6px 8px 6px 13px;border-radius:25px;font-size:12px}.date input,.date button{min-height:40px;border:0;border-radius:18px;padding:8px 12px;font:inherit}.date input{font-weight:bold;color:#194a52}.date button{background:var(--teal);color:white;font-weight:bold;cursor:pointer}.hero{max-width:1300px;margin:auto;padding:42px 28px 26px}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--teal);margin:0 0 10px}.hero h1{margin:0;font-size:clamp(29px,4.5vw,50px);letter-spacing:-2px}.layout{max-width:1300px;margin:auto;padding:0 28px 35px;display:grid;grid-template-columns:235px 1fr;gap:18px}.card{background:#fff;border:1px solid #dbe8e6;border-radius:17px;box-shadow:0 12px 30px #174f5814}.side{padding:22px}.side h2{margin:0 0 8px;font-size:19px}.range{color:var(--teal);font:28px Georgia,serif}.side p,.side small{color:#688287;font-size:11px;line-height:1.65}.jump{display:block;width:100%;border:0;border-radius:8px;background:#f5faf9;padding:10px;margin-top:7px;text-align:left;color:#315e65;cursor:pointer}.jump:hover{background:#ddf0ed}.mapcard{overflow:hidden}.bar{padding:12px 16px;background:#fff;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:#5d7b82}.bar button{border:1px solid #cfe4e0;background:#f6faf9;border-radius:7px;padding:7px 9px;color:#16777b;cursor:pointer}.summary{background:#e5f5f1;padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:#427075;border-top:1px solid #d2e8e3}.summary b,strong{color:var(--teal)}#map{height:520px}.hint{margin:0;padding:11px;text-align:center;font-size:11px;color:#52777e;background:#f8fcfb}.guide{padding:23px 20px;background:#f8fcfb;border-top:1px solid #dcecea}.guidehead{display:flex;justify-content:space-between;align-items:end;gap:12px}.guidehead h2{font-size:18px;margin:4px 0}.guidehead span{font-size:10px;background:#e1f2ee;padding:6px 9px;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.fishcard{background:white;border:1px solid #dcebe8;border-radius:12px;padding:13px}.fishcard h3{margin:0;font-size:15px}.fishcard>p{font-size:10px;color:#6e8b91;margin:4px 0 10px}.fishcard dl{margin:0;display:grid;gap:6px}.fishcard dl div{display:grid;grid-template-columns:58px 1fr;gap:6px}.fishcard dt{font-size:10px;color:var(--teal);font-weight:bold}.fishcard dd{margin:0;font-size:10px;line-height:1.5;color:#587278}.marker{width:31px;height:31px;border:2px solid white;border-radius:50%;background:#087f83;display:grid;place-items:center;font-size:16px;box-shadow:0 2px 8px #17324277}.zone{background:var(--c);border:3px solid #fff;border-radius:50%;padding:7px;color:#fff;font-size:11px;font-weight:bold;box-shadow:0 3px 9px #17324277;white-space:nowrap}.leaflet-popup-content{font:12px Arial,"Malgun Gothic",sans-serif;line-height:1.6}@media(max-width:800px){.layout{grid-template-columns:1fr;padding:0 14px 24px}.hero{padding:28px 18px 20px}.side{display:none}#map{height:460px}.grid{grid-template-columns:1fr}.guidehead{align-items:start;flex-direction:column}}
</style></head><body><header class="top"><div class="brand">● 바다온 <b>FISH MAP</b></div><div class="date"><label>기록일 <input id="date" type="date" value="2026-08-06"></label><button id="today">오늘 상태 보기</button></div></header><section class="hero"><p class="eyebrow" id="record">한반도 영해 · 수온 기록</p><h1>수온 데이터로 찾는 물고기의 위치</h1></section><main class="layout"><aside class="card side"><p class="eyebrow">SEA OBSERVATION</p><h2 id="seasonTitle">여름 바다 관측</h2><div class="range" id="range">20.4–26.1°C</div><p>날짜를 바꾸면 수온·관측 지점·추정 개체수와 어종 위치가 함께 바뀝니다.</p><hr><b style="font-size:12px">해역 바로가기</b><div id="jumps"></div><small>수온과 어종 정보는 교육·탐색용 예시입니다. 실제 출현은 관측 자료와 현장 상황에 따라 달라집니다.</small></aside><section class="card mapcard"><div class="bar"><span>한반도 해역 지도 · 스크롤/핀치로 확대</span><button id="reset">전체 지도</button></div><div class="summary"><b id="dateText"></b><span>관측 지점 <strong id="count"></strong></span><span>추정 개체수 <strong id="population"></strong></span></div><div id="map"></div><p class="hint" id="hint"></p><section class="guide"><div class="guidehead"><div><p class="eyebrow">SPECIES FIELD GUIDE</p><h2 id="guideTitle">남해 동부 대표 어종 알아보기</h2></div><span id="guideCount"></span></div><div class="grid" id="guides"></div></section></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const zones=[
{id:'west',name:'서해 중부',at:[36.25,125.35],c:'#3e9bd7',t:[10.8,23.2,18.4,4.8],fish:[['🦀','꽃게','푸른빛 등딱지와 넓은 다리가 특징입니다.','단백질과 타우린을 포함합니다.'],['🐙','주꾸미','작은 몸통과 여덟 다리, 둥근 흡반이 특징입니다.','저지방 단백질과 타우린을 포함합니다.'],['🐟','넙치','두 눈이 한쪽으로 모인 납작한 몸입니다.','담백한 흰 살에 단백질이 풍부합니다.'],['🐠','참조기','황금빛 옆줄이 보이는 타원형 몸입니다.','단백질과 비타민 B군을 포함합니다.']]},
{id:'east',name:'동해 중부',at:[37.05,130.05],c:'#2469b8',t:[11.2,20.4,18.1,8.1],fish:[['🐟','도루묵','작고 길쭉한 은색 몸을 가집니다.','단백질과 칼슘을 포함합니다.'],['🐠','대구','큰 머리와 넓은 입이 특징입니다.','지방이 적고 단백질이 많은 흰 살 생선입니다.'],['🦑','오징어','원뿔형 몸통과 긴 촉수, 큰 눈이 특징입니다.','단백질과 타우린이 대표 영양 성분입니다.'],['🐟','가자미','두 눈이 한쪽에 있는 저서성 어종입니다.','담백한 단백질과 무기질을 얻을 수 있습니다.']]},
{id:'southwest',name:'남해 서부',at:[34.05,126.55],c:'#e5a530',t:[13.7,24.6,20.9,7.5],fish:[['🐠','감성돔','은회색 몸과 검은 세로 무늬가 특징입니다.','단백질과 담백한 지방을 포함합니다.'],['🐙','낙지','둥근 몸통과 강한 흡반을 가집니다.','저지방 단백질과 타우린을 포함합니다.'],['🐟','민어','길고 납작한 은색 몸과 큰 입이 특징입니다.','단백질과 지방산을 포함합니다.'],['🐠','전어','옆으로 납작하고 배 비늘이 톱니 모양입니다.','단백질·칼슘·불포화지방산을 포함합니다.']]},
{id:'southeast',name:'남해 동부',at:[33.72,128.55],c:'#ef744f',t:[14.9,24.8,21.8,10.8],fish:[['🐠','참돔','분홍빛 몸과 푸른 반점이 특징입니다.','단백질과 비타민 B군을 포함합니다.'],['🐟','갈치','은빛 리본처럼 긴 몸이 특징입니다.','단백질과 불포화지방산을 포함합니다.'],['🐠','방어','유선형 은빛 몸과 노란 옆줄이 보입니다.','오메가-3 지방산을 포함합니다.'],['🐟','고등어','등의 푸른 물결무늬가 특징입니다.','오메가-3 지방산과 단백질이 알려져 있습니다.']]},
{id:'jeju',name:'제주 해역',at:[32.95,127.18],c:'#d84c77',t:[16.6,26.1,23.4,14.2],fish:[['🐟','자리돔','작은 타원형 몸에 푸른빛이 섞입니다.','단백질과 칼슘을 포함합니다.'],['🐠','부시리','방어와 비슷하고 노란 옆줄이 선명합니다.','단백질과 불포화지방산을 포함합니다.'],['🐟','옥돔','붉은빛이 감도는 길쭉한 몸입니다.','담백한 단백질과 무기질을 포함합니다.'],['🐠','다금바리','두툼한 몸과 얼룩무늬, 큰 입이 특징입니다.','단백질 중심의 흰 살 어종입니다.']]}
];
const seasons=['봄','여름','가을','겨울'],ranges=['10.8–16.6°C','20.4–26.1°C','18.1–23.4°C','4.8–14.2°C'],bases=[12400,31800,24100,8700];let active=zones[3],map=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([35.5,128],7),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const seasonOf=d=>{let m=+d.slice(5,7);return m>=3&&m<=5?0:m<=8?1:m<=11?2:3};const icon=h=>L.divIcon({className:'',html:h,iconSize:[34,34],iconAnchor:[17,17]});
function focus(z){active=z;map.flyTo(z.at,8,{duration:1});render()};function render(){let d=document.querySelector('#date').value||'2026-08-06',s=seasonOf(d),day=+d.slice(-2),shift=(day-16)*.008,points=7+((day+s*4)%12),pop=Math.round(bases[s]*(.82+((day*3+s)%9)*.045)/100)*100;layer.clearLayers();zones.forEach(z=>L.marker(z.at,{icon:icon(`<div class="zone" style="--c:${z.c}">${z.name}</div>`)}).on('click',()=>focus(z)).addTo(layer));let fishPool=zones.flatMap(z=>z.fish.map((f,i)=>({f,z,i})));for(let i=0;i<points;i++){let x=fishPool[(i+day+s*3)%fishPool.length],lat=x.z.at[0]+(i%3-1)*.32+shift,lng=x.z.at[1]+(Math.floor(i/3)-1)*.32+shift;L.marker([lat,lng],{icon:icon(`<div class="marker">${x.f[0]}</div>`)}).bindPopup(`<b>${x.f[0]} ${x.f[1]}</b><br>${seasons[s]} 분포 예시<br>위도: ${lat.toFixed(4)}<br>경도: ${lng.toFixed(4)}`).addTo(layer)}document.querySelector('#record').textContent=`한반도 영해 · ${d} · ${seasons[s]} 수온 기록`;document.querySelector('#seasonTitle').textContent=`${seasons[s]} 바다 관측`;document.querySelector('#range').textContent=ranges[s];document.querySelector('#dateText').textContent=`${d} · ${seasons[s]}`;document.querySelector('#count').textContent=points+'개';document.querySelector('#population').textContent=pop.toLocaleString()+'마리';document.querySelector('#hint').textContent=`${seasons[s]} 어종 관측 ${points}개 지점 · 날짜를 바꾸면 지점·좌표·추정 개체수가 함께 바뀝니다.`;document.querySelector('#guideTitle').textContent=active.name+' 대표 어종 알아보기';document.querySelector('#guideCount').textContent='선택 해역 · '+active.fish.length+'종';document.querySelector('#guides').innerHTML=active.fish.map((f,i)=>`<article class="fishcard"><h3>${f[0]} ${f[1]}</h3><p>대표 서식 해역 · ${active.name}</p><dl><div><dt>생김새</dt><dd>${f[2]}</dd></div><div><dt>영양</dt><dd>${f[3]}</dd></div><div><dt>제철·분포</dt><dd>${seasons[s]} 수온 변화에 따라 해역별 분포가 달라집니다.</dd></div><div><dt>관찰 포인트</dt><dd>수심과 수온, 조류의 영향을 함께 확인하세요.</dd></div></dl></article>`).join('')}
document.querySelector('#date').onchange=render;document.querySelector('#today').onclick=()=>{document.querySelector('#date').value=new Date().toISOString().slice(0,10);render()};document.querySelector('#reset').onclick=()=>map.flyTo([35.5,128],7,{duration:1});document.querySelector('#jumps').innerHTML=zones.map(z=>`<button class="jump" onclick="focus(zones.find(x=>x.id==='${z.id}'))">● ${z.name}</button>`).join('');render();
</script></body></html>
